<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamForge</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            padding: 45px;
            border: 1px solid #444;
            border-radius: 18px;
            background: #181818;
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #aaa;
        }

        .status {
            margin-top: 30px;
            padding: 12px 20px;
            border-radius: 10px;
            background: #222;
            color: #7CFF8A;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>ExamForge</h1>

        <p>A personal project built with Python.</p>

        <div class="status">
            ● Running from the PC
        </div>

        <p>
            Connected through the local network.
        </p>
    </div>

</body>
</html>
